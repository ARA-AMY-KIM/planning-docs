<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM 기획 문서</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --primary:#145CE6; --primary-strong:#073894;
    --g25:#F5F6F7; --g50:#EFEFF1; --g100:#DEE0E3; --g200:#C3C5C9;
    --g400:#8D8F94; --g500:#73767A; --g600:#5A5C61; --g900:#131314;
    --radius:6px;
    --shadow:0 0 2px 0 rgba(0,0,0,.20);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    background:var(--g25); color:var(--g900); line-height:1.6; font-size:16px;
    padding:56px 20px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px; margin:0 auto;}

  /* ===== Header ===== */
  header{margin-bottom:36px;}
  .eyebrow{font-size:18px; letter-spacing:.06em; color:var(--primary); font-weight:700; text-transform:uppercase; margin-bottom:11px;}
  header h1{font-size:38px; font-weight:800; letter-spacing:-.02em; line-height:1.2; margin-bottom:14px;}
  header .owner{font-size:14px; color:var(--g600); margin:0;}
  header .owner strong{color:var(--g900); font-weight:600;}
  .meta{display:flex; gap:24px; flex-wrap:wrap; font-size:14px; color:var(--g600); border-top:1px solid var(--g100); padding-top:16px;}
  .meta strong{color:var(--g900); font-weight:600; margin-right:6px;}

  /* ===== Section ===== */
  section{margin-bottom:28px;}
  .sec-title{font-size:14px; font-weight:700; color:var(--g500); letter-spacing:.04em; margin-bottom:14px; padding-left:2px;}

  /* ===== Policy cards ===== */
  .policy{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .policy a{
    display:block; background:#fff; border:1px solid var(--g100); border-radius:var(--radius);
    padding:15px 20px; text-decoration:none; box-shadow:var(--shadow); transition:border-color .15s;
  }
  .policy .prow{display:flex; align-items:baseline; justify-content:space-between; gap:14px;}
  .policy a:hover{border-color:var(--primary);}
  .policy .label{font-size:12px; font-weight:700; color:var(--primary); letter-spacing:.08em; margin-bottom:5px;}
  .policy .name{font-size:17px; font-weight:600; color:var(--g900);}
  .policy .open{font-size:14px; color:var(--g400); white-space:nowrap; flex-shrink:0;}

  /* ===== Menu list ===== */
  .menu-list{background:#fff; border:1px solid var(--g100); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
  .menu-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 22px; border-bottom:1px solid var(--g50);}
  .menu-row:last-child{border-bottom:none;}
  .menu-name{font-size:17px; font-weight:600; color:var(--g900);}
  .menu-name a{color:var(--primary); text-decoration:none; border-bottom:1px solid transparent;}
  .menu-name a:hover{border-bottom-color:var(--primary);}
  .menu-slug{font-size:13px; color:var(--g400); margin-top:3px;}
  .menu-links{display:flex; gap:8px; flex-shrink:0;}
  .btn{font-size:14px; font-weight:600; text-decoration:none; padding:9px 16px; border-radius:var(--radius); white-space:nowrap; transition:.15s;}
  .btn-mock{background:var(--primary); color:#fff;}
  .btn-mock:hover{background:var(--primary-strong);}
  .btn-doc{background:#fff; color:var(--primary); border:1px solid var(--g200);}
  .btn-doc:hover{border-color:var(--primary);}

  /* ===== Section head (title + action) ===== */
  .sec-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;}
  .sec-head .sec-title{margin-bottom:0;}
  .btn-wbs{background:#fff; color:var(--primary); border:1px solid var(--g200);}
  .btn-wbs:hover{border-color:var(--primary);}
  .btn-disabled{background:var(--g50); color:var(--g400); border:1px solid var(--g100); cursor:default;}
  .btn-alt{background:#fff; color:var(--g600); border:1px solid var(--g200);}
  .btn-alt:hover{border-color:var(--g400); color:var(--g900);}

  /* ===== Backlink / Header row ===== */
  .backlink{display:inline-block; font-size:14px; color:var(--g500); text-decoration:none; margin-bottom:14px;}
  .backlink:hover{color:var(--primary);}
  .hrow{display:flex; align-items:flex-end; justify-content:space-between; gap:20px;}
  .hrow .btn{flex-shrink:0;}

  /* ===== Hub cards (root) ===== */
  .hub{display:grid; gap:12px;}
  .hub a{
    display:block; background:#fff; border:1px solid var(--g100); border-radius:var(--radius);
    padding:20px 22px; text-decoration:none; box-shadow:var(--shadow); transition:border-color .15s;
  }
  .hub a:hover{border-color:var(--primary);}
  .hub .hrow2{display:flex; align-items:baseline; justify-content:space-between; gap:14px;}
  .hub .name{font-size:19px; font-weight:700; color:var(--g900);}
  .hub .open{font-size:14px; color:var(--g400); white-space:nowrap; flex-shrink:0;}
  .hub .desc{font-size:14px; color:var(--g600); margin-top:6px;}

  /* ===== Footer ===== */
  footer{margin-top:40px; padding-top:18px; border-top:1px solid var(--g100); font-size:13px; color:var(--g400); text-align:center;}

  /* ===== Mobile ===== */
  @media(max-width:600px){
    body{padding:32px 14px; font-size:15px;}
    header h1{font-size:29px;}
    header h1 .sub{font-size:15px;}
    .policy{grid-template-columns:1fr;}
    .menu-row{flex-direction:column; align-items:flex-start;}
    .menu-links{width:100%;}
    .btn{flex:1; text-align:center;}
    .hrow{flex-direction:column; align-items:flex-start; gap:14px;}
    .hrow .btn{width:100%; text-align:center;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">PLANNING DOCS</div>
    <h1>CRM 기획 문서</h1>
    <!-- 담당자 이름은 여기서 수정 -->
    <p class="owner"><strong>기획 담당</strong> : 김아라</p>
  </header>

  <!-- ============================================================
       프로젝트
       * 프로젝트 추가: 아래 hub 카드 블록 하나를 복사해서
         [프로젝트명 / 설명 / 링크]만 바꾸면 됩니다.
  ============================================================ -->
  <section>
    <div class="sec-title">프로젝트</div>
    <div class="hub">

      <a href="/crm-admin/">
        <div class="hrow2">
          <div class="name">CRM Admin 신규 구축</div>
          <div class="open">문서 열기 &rarr;</div>
        </div>
        <div class="desc">역할·계정 정책, 어드민 메뉴별 화면 목업 &amp; 기능정의서</div>
      </a>

      <a href="/internet-product/">
        <div class="hrow2">
          <div class="name">인터넷 상품 구조 개선</div>
          <div class="open">문서 열기 &rarr;</div>
        </div>
        <div class="desc">Phase 1 태그 구조 개선 &middot; 전체 일정(WBS)과 화면 시안</div>
      </a>

      <!-- ▲ 새 프로젝트는 이 줄 위에 카드 블록을 복사해 추가하세요 -->

    </div>
  </section>

  <!-- ============================================================
       도구
  ============================================================ -->
  <section>
    <div class="sec-title">도구</div>
    <div class="hub">
      <a href="/tools/profile-matrix/">
        <div class="hrow2">
          <div class="name">발신프로필 매트릭스</div>
          <div class="open">열기 &rarr;</div>
        </div>
        <div class="desc">발신프로필 조합 확인 도구</div>
      </a>
    </div>
  </section>

  <footer>
    CRM 기획 문서 &middot; 기획 김아라
  </footer>

</div>
</body>
</html>
