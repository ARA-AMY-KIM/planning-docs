<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인터넷 상품 관리 목업</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{
 --primary:#145CE6;--primary-strong:#073894;
 --success:#10A10E;--warning:#D75011;--error:#C31518;--negative:#C70C34;--hold:#5714E6;
 --g25:#F5F6F7;--g50:#EFEFF1;--g100:#DEE0E3;--g200:#C3C5C9;--g300:#A9ABB0;
 --g400:#8D8F94;--g500:#73767A;--g600:#5A5C61;--g700:#424447;--g800:#2A2C2E;--g900:#131314;
 --blue50:#ECF2FF;--blue100:#D9E6FF;--green50:#E0FCE0;--red50:#FEE6E6;--red100:#FCCCCD;
 --orange50:#FDEBE3;--purple50:#F2ECFF;--link:#2F9E68;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:light}
input,select,textarea{background:#fff;color:var(--g900);font-family:inherit}
[hidden]{display:none!important}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
 font-size:16px;color:var(--g900);background:#fff;-webkit-font-smoothing:antialiased}
.wrap{min-width:1440px}
.sheet{max-width:1456px;margin:0 auto;padding:0 32px}
.gnb{height:60px;border-bottom:1px solid var(--g100);display:flex;align-items:center;gap:36px;padding:0 32px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.4px}
.logo i{background:var(--primary);color:#fff;font-size:9px;font-weight:800;padding:3px 5px;border-radius:3px;font-style:normal}
.gnb nav{display:flex;gap:26px;font-size:14px;font-weight:600;letter-spacing:-.3px;color:var(--g700)}
.gnb nav .on{color:var(--primary)}
.gnb .sp{flex:1}
.gnb .ic{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--g300)}
.page{padding:32px 32px 8px}
.bc{font-size:14px;line-height:20px;color:var(--g400);letter-spacing:-.2px;margin-bottom:4px}
.ptitle{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ptitle h1{font-size:32px;font-weight:700;line-height:42px;letter-spacing:-.5px;color:#000}
.star{color:var(--g300);font-size:20px}
.pdesc{font-size:14px;line-height:20px;color:var(--g500);letter-spacing:-.3px;margin-bottom:28px}
.notice{display:flex;gap:8px;align-items:flex-start;padding:12px 16px;border-radius:8px;
 font-size:13px;line-height:1.6;letter-spacing:-.2px;margin-bottom:20px}
.notice .i{flex:0 0 16px;height:16px;border-radius:50%;font-size:10px;font-weight:800;color:#fff;
 display:flex;align-items:center;justify-content:center;margin-top:2px}
.notice.info{background:var(--blue50);color:var(--g700)}
.notice.info .i{background:var(--primary)}
.vtabs{display:flex;border-bottom:1px solid var(--g100);margin-bottom:14px}
.vtabs .ti{padding:12px 20px;font-size:14px;font-weight:600;color:var(--g500);border-bottom:2px solid transparent;
 margin-bottom:-1px;cursor:pointer;letter-spacing:-.3px}
.vtabs .ti.on{color:var(--g900);border-bottom-color:var(--primary)}
.chips{display:inline-flex;gap:6px;margin-bottom:14px}
.chips button{height:32px;padding:0 12px;border:1px solid var(--g200);background:#fff;border-radius:16px;
 font-size:13px;font-family:inherit;color:var(--g600);cursor:pointer;letter-spacing:-.2px}
.chips button.on{border-color:var(--primary);color:var(--primary);font-weight:700;background:var(--blue50)}
.legend{display:flex;align-items:center;gap:14px;margin-bottom:16px;font-size:12px;color:var(--g600)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:22px;height:12px;border-radius:3px;display:inline-block}
.cnt{font-size:14px;line-height:20px;letter-spacing:-.3px;color:var(--g500);margin-bottom:12px}
.cnt b{font-weight:700;color:var(--g900)}
.cnt .warn{color:var(--negative);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px;margin-left:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.gcard{border:1px solid var(--g100);border-radius:10px;background:#fff;overflow:hidden}
.gcard>.gh{height:40px;background:var(--g50);border-bottom:1px solid var(--g100);
 display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--g700)}
.cols{display:grid;grid-template-columns:1fr 56px 1fr;padding:16px;position:relative}
.cols.single{grid-template-columns:1fr}
.col>.ch{font-size:12px;font-weight:700;color:var(--g600);text-align:center;padding-bottom:10px}
.pit{position:relative;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;margin-bottom:8px;
 border:1px solid var(--g100);border-radius:6px;background:#fff;font-size:13px;letter-spacing:-.3px;cursor:pointer;
 user-select:none}
.pit:hover{border-color:var(--g300)}
.pit .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pit.sel{border-color:var(--primary);border-width:2px;background:var(--blue50);font-weight:600}
.pit.lit{border-color:var(--link);background:#F1FBF5}
.pit.off{background:var(--g25);color:var(--g300)}
.pit .tg{font-size:11px;color:var(--g500);flex:none}
.pit .nt{font-size:11px;font-weight:700;color:var(--negative);background:var(--red50);border-radius:4px;padding:3px 6px;flex:none}
.link-lane{position:relative}
svg.lane{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.menu{position:fixed;z-index:60;width:230px;background:#fff;border:1px solid var(--g100);border-radius:8px;
 padding:6px 0;box-shadow:0 8px 28px rgba(19,19,20,.16)}
.menu .mi{padding:7px 14px;font-size:13px;color:var(--g700);letter-spacing:-.3px;display:flex;
 align-items:center;justify-content:space-between;cursor:default}
.menu .mi:hover{background:var(--g25)}
.menu .mi.act{color:var(--primary);font-weight:700;cursor:pointer}
.menu .mi.act:hover{background:var(--blue50)}
.menu .newb{font-size:10px;font-weight:700;background:var(--primary);color:#fff;border-radius:3px;padding:1px 5px}
.menu .sep{height:1px;background:var(--g100);margin:6px 0}
.ov{position:fixed;inset:0;background:rgba(19,19,20,.35);z-index:80;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border:1px solid var(--g100);border-radius:12px;box-shadow:0 8px 28px rgba(19,19,20,.10);
 overflow:hidden;width:511px}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px}
.modal .mh h3{font-size:17px;font-weight:700;letter-spacing:-.4px}
.modal .x{color:var(--g400);font-size:17px;cursor:pointer}
.modal .mb{padding:0 20px 18px}
.modal .mf{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--g100)}
.modal .mf .sp{flex:1}
.ctx{display:flex;gap:40px;background:var(--g25);border-radius:8px;padding:12px 18px;margin-bottom:16px}
.ctx div{display:flex;align-items:baseline;gap:10px}
.ctx .k{font-size:12px;color:var(--g500)}
.ctx .v{font-size:15px;font-weight:700;color:var(--g900);letter-spacing:-.3px}
.fld{margin-bottom:14px}
.fld>label{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;margin-bottom:6px}
.fld>label .req{color:var(--error)}
.fld>label .sp{flex:1}
.fld>label .ro{font-size:11px;font-weight:400;color:var(--g400)}
.inp{width:100%;height:36px;padding:8px 12px;border:1px solid var(--g200);border-radius:8px;
 font-size:14px;letter-spacing:-.3px;color:var(--g900);background:#fff}
.inp.ro{background:var(--g25);color:var(--g700);display:flex;align-items:center}
select.inp{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:34px;
 background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M7 10l5 5 5-5z' fill='%238D8F94'/%3E%3C/svg%3E");
 background-repeat:no-repeat;background-position:right 12px center;background-size:16px 16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prev{background:var(--blue50);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.prev .k{font-size:11px;font-weight:700;color:var(--primary);flex:none}
.prev .v{font-size:15px;font-weight:700;color:var(--primary-strong);letter-spacing:-.3px}
.hint{font-size:12px;color:var(--g500);margin-top:6px;line-height:1.5}
.btn-solid{background:var(--primary);border:none;border-radius:8px;padding:8px 16px;font-size:14px;
 font-weight:600;color:#fff;cursor:pointer;height:36px;font-family:inherit}
.btn-out{background:#fff;border:1px solid var(--g200);border-radius:8px;padding:6px 12px;font-size:14px;
 font-weight:600;color:var(--g900);cursor:pointer;height:36px;font-family:inherit}
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);z-index:99;color:#fff;font-size:14px;
 padding:12px 18px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
footer{padding:40px 32px 60px;font-size:12px;color:var(--g400);text-align:center;border-top:1px solid var(--g100);margin-top:48px}
</style>
</head>
<body>
<div class="wrap">

<div class="gnb">
  <div class="logo"><i>OXC</i>CRM Admin</div>
  <nav><span>업체 관리</span><span class="on">상품 관리</span><span>운영 관리</span><span>개발 설정</span><span>비즈터널 운영</span><span>어드민 운영</span></nav>
  <div class="sp"></div><div class="ic"></div><div class="ic"></div>
</div>

<div class="sheet page">
  <div class="bc">상품 관리</div>
  <div class="ptitle"><h1>인터넷 상품 관리</h1><span class="star">☆</span></div>
  <div class="pdesc">인터넷 상품의 요금제와 판매 정보를 관리합니다.</div>

  <div class="notice info"><span class="i">i</span>
    <span id="noteTx"></span></div>

  <div class="vtabs" id="vtabs"></div>

  <div class="chips" id="chips">
    <button class="on">메인상품</button><button>부가서비스</button><button>기타상품</button>
    <button>결합할인</button><button>결합카드</button><button>기타</button>
  </div>

  <div class="legend">
    <span><i style="background:#fff;border:1px solid var(--g100)"></i>판매중</span>
    <span><i style="background:var(--g25);border:1px solid var(--g100)"></i>미사용</span>
    <span><i style="background:var(--blue50);border:1px solid var(--primary)"></i>선택</span>
    <span><i style="background:#F1FBF5;border:1px solid var(--link)"></i>연결된 짝</span>
    <span style="color:var(--negative);font-weight:600">· 태그 없음 = 태그 미연결</span>
  </div>

  <div class="cnt" id="cnt"></div>

  <div class="grid" id="grid"></div>
</div>

<footer>인터넷 상품 관리 — 태그 연결 변경분 시안 · 카드를 클릭하면 조합이, 우클릭하면 메뉴가 열립니다.</footer>
</div>

<div class="ov" id="ovTag" hidden>
  <div class="modal">
    <div class="mh"><h3>태그 연결</h3><span class="x" id="tgX">✕</span></div>
    <div class="mb">
      <div class="ctx">
        <div><span class="k">업체</span><span class="v" id="tgVen"></span></div>
        <div><span class="k">구분</span><span class="v" id="tgSvc"></span></div>
        <div><span class="k">축</span><span class="v" id="tgAxis"></span></div>
      </div>
      <div class="row2">
        <div class="fld"><label>상품</label><div class="inp ro" id="tgProd"></div></div>
        <div class="fld"><label>태그 <span class="req">*</span></label>
          <select class="inp" id="tgSel"></select></div>
      </div>
      <div class="fld" style="margin-bottom:0">
        <label>고객 노출 <span class="sp"></span><span class="ro">자동 계산</span></label>
        <div class="prev"><span class="k">상담 상세</span><span class="v" id="tgPrev"></span></div>
        <div class="hint">상품명과 태그명을 조합해 보여줍니다. 저장하면 상담 상세에 이 값으로 표시됩니다.</div>
      </div>
    </div>
    <div class="mf"><div class="sp"></div><button class="btn-out" id="tgCancel">취소</button><button class="btn-solid" id="tgSave">저장</button></div>
  </div>
</div>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isNet = g => g.svc === '인터넷';
const noTag = (g, side, name) => (NOTAG[V+'|'+g.label+'|'+side]||[]).indexOf(name) >= 0;

function tagOf(g, side, name){
  if (noTag(g, side, name)) return '';
  const arr = side === 'row' ? g.rows : g.cols;
  const hit = arr.find(x => x[0] === name);
  return hit ? hit[1] : '';
}

function renderTabs(){
  $('vtabs').innerHTML = VENS.map(v => '<div class="ti'+(v===V?' on':'')+'" data-v="'+esc(v)+'">'+esc(v)+'</div>').join('');
  $('vtabs').querySelectorAll('[data-v]').forEach(el => el.onclick = () => { V = el.dataset.v; SEL = null; render(); });
}

function card(g, side, name){
  const t = tagOf(g, side, name);
  const nt = noTag(g, side, name);
  const showTag = !isNet(g) || side === 'row';
  return '<div class="pit" data-g="'+esc(g.label)+'" data-s="'+side+'" data-n="'+esc(name)+'">'
    + '<span class="nm">'+esc(name)+'</span>'
    + (nt ? '<span class="nt">태그 없음</span>' : (showTag && t ? '<span class="tg">'+esc(t)+'</span>' : ''))
    + '</div>';
}

  renderTabs();
  const gs = D[V] || [];
  let miss = 0;
  gs.forEach(g => {
    g.rows.forEach(r => { if (noTag(g,'row',r[0])) miss++; });
    g.cols.forEach(c => { if (noTag(g,'col',c[0])) miss++; });
  });
  const tot = gs.reduce((a,g) => a + g.rows.length + g.cols.length, 0);
  $('cnt').innerHTML = '상품 <b>'+tot+'</b>개'
    + (miss ? '<span class="warn" id="onlyBtn">'+(ONLY?'전체 보기':'태그 미연결 '+miss+'건')+'</span>' : '');

  $('grid').innerHTML = gs.map(g => {
    const rows = g.rows.filter(r => !ONLY || noTag(g,'row',r[0]));
    const cols = g.cols.filter(c => !ONLY || noTag(g,'col',c[0]));
    const single = g.cols.length === 0;
    return '<div class="gcard"><div class="gh">'+esc(g.label)+'</div>'
      + '<div class="cols'+(single?' single':'')+'" data-g="'+esc(g.label)+'">'
      + '<div class="col"><div class="ch">'+esc(g.rowName)+'</div>'+rows.map(r => card(g,'row',r[0])).join('')+'</div>'
      + (single ? '' : '<div class="link-lane"><svg class="lane"></svg></div>'
          + '<div class="col"><div class="ch">'+esc(g.colName)+'</div>'+cols.map(c => card(g,'col',c[0])).join('')+'</div>')
      + '</div></div>';
  }).join('');

  const ob = $('onlyBtn'); if (ob) ob.onclick = () => { ONLY = !ONLY; render(); };
  bind();
}

function bind(){
  document.querySelectorAll('.pit').forEach(el => {
    el.onclick = e => { e.stopPropagation(); pick(el); };
    el.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); pick(el); openMenu(el, e.clientX, e.clientY); };
  });
}

function grp(label){ return (D[V]||[]).find(g => g.label === label); }

function pick(el){
  document.querySelectorAll('.pit').forEach(x => x.classList.remove('sel','lit'));
  el.classList.add('sel');
  SEL = { g: el.dataset.g, s: el.dataset.s, n: el.dataset.n };
  const g = grp(SEL.g); if (!g) return;
  let mates = [];
  if (SEL.s === 'row') mates = (g.pair[SEL.n] || []);
  else mates = Object.keys(g.pair).filter(p => (g.pair[p]||[]).indexOf(SEL.n) >= 0);
  const box = el.closest('.cols');
  mates.forEach(m => {
    const t = box.querySelector('.pit[data-s="'+(SEL.s==='row'?'col':'row')+'"][data-n="'+CSS.escape(m)+'"]');
    if (t) t.classList.add('lit');
  });
  drawLanes(box, el, mates);
}

function drawLanes(box, el, mates){
  const svg = box.querySelector('svg.lane'); if (!svg) return;
  const lane = svg.parentElement, lb = lane.getBoundingClientRect();
  svg.innerHTML = '';
  const a = el.getBoundingClientRect();
  const fromRow = SEL.s === 'row';
  mates.forEach(m => {
    const t = box.querySelector('.pit[data-s="'+(fromRow?'col':'row')+'"][data-n="'+CSS.escape(m)+'"]');
    if (!t) return;
    const b = t.getBoundingClientRect();
    const y1 = a.top + a.height/2 - lb.top, y2 = b.top + b.height/2 - lb.top;
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M0 '+y1.toFixed(1)+' C 28 '+y1.toFixed(1)+', 28 '+y2.toFixed(1)+', 56 '+y2.toFixed(1));
    p.setAttribute('fill','none'); p.setAttribute('stroke','#2F9E68'); p.setAttribute('stroke-width','1.5');
    svg.appendChild(p);
  });
}

const BASE = ['상품 요금 설정','상품 할인 설정','상품 이벤트 설정','금지 코드 설정'];
const TAIL = ['설명 바꾸기','위로','아래로','우선순위 변경 (기본)','사용중지'];

function openMenu(el, x, y){
  closeMenu();
  const g = grp(el.dataset.g); if (!g) return;
  const net = isNet(g);
  const act = net ? '상품 연결 등록' : '태그 연결';
  const m = document.createElement('div');
  m.className = 'menu';
  m.innerHTML = BASE.map(l => '<div class="mi">'+l+'</div>').join('')
    + '<div class="mi act" id="miAct">'+act+'<span class="newb">추가</span></div>'
    + '<div class="sep"></div>' + TAIL.map(l => '<div class="mi">'+l+'</div>').join('');
  document.body.appendChild(m);
  const w = 230, h = m.offsetHeight;
  m.style.left = Math.min(x, innerWidth - w - 12) + 'px';
  m.style.top = Math.min(y, innerHeight - h - 12) + 'px';
  MENU = m;
  CUR = { g: g, side: el.dataset.s, name: el.dataset.n };
  document.getElementById('miAct').onclick = () => { closeMenu(); net ? toast('상품 연결 관리로 이동합니다.', '#73767A') : openTag(); };
}
function closeMenu(){ if (MENU) { MENU.remove(); MENU = null; } }
document.addEventListener('click', closeMenu);
document.addEventListener('contextmenu', e => { if (!e.target.closest('.pit')) closeMenu(); });

function openTag(){
  const g = CUR.g, side = CUR.side, name = CUR.name;
  $('tgVen').textContent = V;
  $('tgSvc').textContent = g.svc;
  $('tgAxis').textContent = side === 'row' ? g.rowName : g.colName;
  $('tgProd').textContent = name;
  const arr = side === 'row' ? g.rows : g.cols;
  const opts = [...new Set(arr.map(x => x[1]).filter(Boolean))].sort();
  const cur = tagOf(g, side, name);
  $('tgSel').innerHTML = (cur ? '' : '<option value="">선택하세요</option>')
    + opts.map(o => '<option'+(o===cur?' selected':'')+'>'+esc(o)+'</option>').join('');
  const upd = () => {
    const v = $('tgSel').value;
    $('tgPrev').textContent = v ? name + '(' + v + ')' : name;
  };
  $('tgSel').onchange = upd; upd();
  $('ovTag').hidden = false;
}
$('tgX').onclick = $('tgCancel').onclick = () => $('ovTag').hidden = true;
$('tgSave').onclick = () => {
  const v = $('tgSel').value;
  if (!v) { toast('태그를 선택해주세요.', '#C31518'); return; }
  const g = CUR.g, key = V+'|'+g.label+'|'+CUR.side;
  if (NOTAG[key]) NOTAG[key] = NOTAG[key].filter(n => n !== CUR.name);
  const arr = CUR.side === 'row' ? g.rows : g.cols;
  const hit = arr.find(x => x[0] === CUR.name); if (hit) hit[1] = v;
  $('ovTag').hidden = true;
  toast('태그를 연결했습니다 — ' + CUR.name + '(' + v + ')', '#0A8208');
  render();
};
function toast(msg, color){
  const n = document.createElement('div'); n.className = 'toast'; n.textContent = msg;
  n.style.background = color; document.body.appendChild(n);
  setTimeout(() => n.remove(), 3200);
}
render();
</script>
